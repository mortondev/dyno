[package]
name = "dyno-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Host a local world from the game (the `dyno` dev binary). Off in the
# `hearthblock` player client, which carries no server and no content.
host = ["dep:dyno-server"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
directories = "6.0.0"
dyno-protocol = { path = "../dyno-protocol" }
dyno-server = { path = "../dyno-server", optional = true }
dyno-sim = { path = "../dyno-sim" }
dyno-world = { path = "../dyno-world" }
# no built-in fonts: the pack brings the game's; two of egui's own stand in
# before the first join (theme::base_fonts), not all four (1 MB of emoji)
egui = { version = "0.33.3", default-features = false }
epaint_default_fonts = "0.33.3"
egui-wgpu = "0.33.3"
# no `links` (webbrowser): the game never opens a browser
egui-winit = { version = "0.33.3", default-features = false, features = ["clipboard", "wayland", "x11"] }
glam = { version = "0.30", features = ["bytemuck"] }
png = "0.18.1"
pollster = "1.0.3"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# window decorations on Wayland and the rest of winit's defaults, as egui-winit had them
winit = "0.30.13"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
dyno-server = { path = "../dyno-server" }
