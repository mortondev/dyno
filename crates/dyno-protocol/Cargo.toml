[package]
name = "dyno-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Dyno network protocol messages"

[dependencies]
dyno-sim = { path = "../dyno-sim" }
dyno-world = { path = "../dyno-world" }
postcard = { version = "1.2.0", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
# pack files on the wire (`wire`); the client already has it through png
miniz_oxide = "0.8.9"
# clips files (`clips`): the client already has it
serde_json = "1.0.154"
