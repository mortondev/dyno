[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mortondev/dyno"
rust-version = "1.88"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"

# The player client (`hearthblock`): small to download. Servers and tools
# keep the release profile above.
[profile.client-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# no unwind tables (about 1.5 MB); nothing in the client catches a panic
panic = "abort"
